<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Классическая эра</title>
  <meta name="description" content="Браузерная стратегия о звёздных державах: колонии, флоты, войны и дипломатия.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/app.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <div id="app"></div>
  <script>
    // Двойной щелчок по index.html открывает сайт как файл — браузер так не грузит модули.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = '<div style="max-width:560px;margin:15vh auto;padding:24px;font:16px/1.6 system-ui;color:#f3ecdc;background:#0a0a0a;border:1px solid #2c2820;border-radius:16px">'
        + '<h1 style="margin:0 0 8px;color:#e9b949;font-size:22px">Сайт открыт как файл</h1>'
        + '<p style="margin:0 0 8px">Так браузер не загружает гайдбук, правила и вход. Запустите сайт через <b>start.bat</b> в папке проекта — он откроет адрес <b>http://localhost:8000</b>.</p>'
        + '<p style="margin:0;color:#948c7c">Или в папке проекта выполните: <code>python -m http.server 8000</code></p></div>';
    }
  </script>
  <!-- three.js для 3D-вида боя: грузится только когда открывают 3D -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
